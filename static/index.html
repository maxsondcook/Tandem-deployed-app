<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tandem</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
  <header>
    <h1>Tandem</h1>
    <p class="sub">App skeleton: browser → FastAPI → Postgres. <span id="health">Checking database…</span></p>
  </header>

  <main>
    <section class="card">
      <h2>1. Plan a trip</h2>
      <form id="trip-form">
        <label>Rider name <input name="rider_name" required value="Test Rider"></label>
        <label>Age <input name="rider_age" type="number" min="0" max="120" required value="22"></label>
        <label>Destination <select name="destination_station_id" id="destination" required></select></label>
        <label>Arrival time <select name="at" id="time"></select></label>
        <label>Min. open docks <input name="min_docks" type="number" min="1" max="50" value="5"></label>
        <button type="submit">Find a dock</button>
      </form>
      <div id="result" class="result" hidden></div>
    </section>

    <section class="card">
      <h2>2. Stations at that time</h2>
      <table>
        <thead><tr><th>Station</th><th class="num">Bikes</th><th class="num">Open docks</th><th class="num">Capacity</th></tr></thead>
        <tbody id="stations"></tbody>
      </table>
    </section>

    <section class="card">
      <h2>3. Bikes available over time</h2>
      <canvas id="chart" height="120"></canvas>
    </section>

    <section class="card">
      <h2>4. Recent trips (read back from the database)</h2>
      <ul id="trips"></ul>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
